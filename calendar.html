<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Календар кіновечорів — YevheniiPel</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #07090d; color: #f4f7fb; font-family: Arial, sans-serif; }
    
    /* Navigation */
    .nav { position: sticky; top: 0; padding: 20px 7%; display: flex; justify-content: space-between; align-items: center; background: #07090dee; border-bottom: 1px solid #222936; z-index: 10; }
    .logo { font-size: 25px; font-weight: 900; text-decoration: none; color: #fff; }
    .logo span { color: #58a8ff; }
    nav { display: flex; gap: 25px; }
    nav a { color: #a8b1bf; text-decoration: none; font-size: 14px; transition: color 0.2s; }
    nav a:hover, nav a.active { color: #58a8ff; }
    .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 14px; cursor: pointer; border: none; }
    .blue { background: #58a8ff; color: #06101a; }
    .blue:hover { background: #7ab8ff; }
    .outline { border: 1px solid #354050; color: white; background: transparent; }
    .outline:hover { border-color: #58a8ff; }
    .admin-only { display: none; }
    body.is-admin .admin-only { display: inline-block; }
    .auth-status { font-size: 12px; color: #8995a5; margin-left: 10px; }

    /* Main Container */
    .container { padding: 40px 7%; max-width: 1200px; margin: 0 auto; }
    
    .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }
    .header-buttons { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .queue-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; background: linear-gradient(135deg, #ffb347, #ff7a18); color: #0b0d11; border: 1px solid rgba(255,255,255,.16); box-shadow: 0 0 0 1px rgba(255,145,35,.15), 0 8px 24px rgba(255,122,24,.22); font-weight: 900; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease, filter .18s ease; }
    .queue-btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255,180,71,.32), 0 12px 30px rgba(255,122,24,.34); filter: brightness(1.05); }
    .queue-btn .queue-icon { font-size: 16px; }
    .section-title { margin: 0; font-size: clamp(30px, 4vw, 48px); letter-spacing: -1.5px; }
    .section-title span { color: #58a8ff; }

    /* Calendar Controls */
    .cal-controls { display: flex; align-items: center; justify-content: space-between; background: #0d121a; border: 1px solid #242c38; padding: 15px 20px; border-radius: 16px; margin-bottom: 25px; }
    .cal-controls h2 { margin: 0; font-size: 20px; font-weight: bold; text-transform: capitalize; }
    .month-btns { display: flex; gap: 10px; }
    .btn-icon { background: #171f2c; border: 1px solid #293341; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-icon:hover { border-color: #58a8ff; color: #58a8ff; }

    /* Calendar Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day-name { text-align: center; font-weight: bold; color: #7e8998; font-size: 13px; padding-bottom: 8px; text-transform: uppercase; }
    
    .day-cell { min-height: 110px; background: #0d1118; border: 1px solid #1c232f; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.2s; position: relative; }
    .day-cell.empty { background: transparent; border: none; }
    .day-cell.today { border-color: #58a8ff; background: #0f1724; }
    .day-num { font-size: 13px; font-weight: bold; color: #65707f; margin-bottom: 4px; }
    .day-cell.today .day-num { color: #58a8ff; }

    /* Movie Event Items */
    .movie-item { font-size: 11px; padding: 6px 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 4px; line-height: 1.2; word-break: break-word; }
    .movie-item.planned { background: rgba(88, 168, 255, 0.15); border: 1px solid rgba(88, 168, 255, 0.4); color: #8fcaff; }
    .movie-item.watched { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.4); color: #2ecc71; text-decoration: line-through; }
    .movie-item .del-btn { background: none; border: none; color: #778291; cursor: pointer; font-size: 12px; padding: 0 2px; }
    .movie-item .del-btn:hover { color: #ff6374; }

    /* Modal Form */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: #0d121a; border: 1px solid #293341; border-radius: 20px; width: 100%; max-width: 420px; padding: 30px; }
    .modal-content h3 { margin-top: 0; margin-bottom: 20px; font-size: 22px; }
    
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; color: #8995a5; font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; background: #07090d; border: 1px solid #293341; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #58a8ff; }
    
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }

    /* Mobile Adaptivity */
    @media(max-width: 768px) {
      nav { display: none; }
      .calendar-grid { gap: 4px; }
      .day-cell { min-height: 75px; padding: 4px; }
      .day-num { font-size: 11px; }
      .movie-item { font-size: 10px; padding: 4px; flex-direction: column; align-items: flex-start; }
      .movie-item .del-btn { align-self: flex-end; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <a class="logo" href="index.html">Yevhenii<span>Pel</span></a>
    <nav>
      <a href="index.html#about">Про мене</a>
      <a href="index.html#content">Контент</a>
      <a href="index.html#schedule">Розклад</a>
      <a href="calendar.html" class="active">Календар</a>
      <a href="index.html#socials">Соцмережі</a>
    </nav>
    <div><button id="loginBtn" class="btn outline" onclick="openLoginModal()">Адмін</button> <button id="logoutBtn" class="btn outline admin-only" onclick="logoutAdmin()">Вийти</button><span id="authStatus" class="auth-status"></span></div>
  </header>

  <main class="container">
    <div class="header-actions">
      <h1 class="section-title">Календар <span>кіновечорів</span></h1>
      <div class="header-buttons">
        <a class="queue-btn" href="queue.html"><span class="queue-icon">🎬</span> Черга фільмів</a>
        <button class="btn blue admin-only" onclick="openModal()">+ Додати фільм</button>
      </div>
    </div>

    <div class="cal-controls">
      <h2 id="monthYearLabel">—</h2>
      <div class="month-btns">
        <button class="btn-icon" onclick="changeMonth(-1)">←</button>
        <button class="btn-icon" onclick="changeMonth(1)">→</button>
      </div>
    </div>

    <div class="calendar-grid" id="calendarGrid">
      <div class="day-name">Пн</div>
      <div class="day-name">Вт</div>
      <div class="day-name">Ср</div>
      <div class="day-name">Чт</div>
      <div class="day-name">Пт</div>
      <div class="day-name">Сб</div>
      <div class="day-name">Нд</div>
      </div>
  </main>

  <div class="modal" id="movieModal">
    <div class="modal-content">
      <h3>Додати запис</h3>
      <form id="movieForm">
        <div class="form-group">
          <label>Назва фільму / шоу</label>
          <input type="text" id="movieTitle" placeholder="напр., Залізна людина 2" required>
        </div>
        <div class="form-group">
          <label>Дата</label>
          <input type="date" id="movieDate" required>
        </div>
        <div class="form-group">
          <label>Статус</label>
          <select id="movieStatus">
            <option value="planned">🔵 Заплановано</option>
            <option value="watched">✅ Переглянуто</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn outline" onclick="closeModal()">Скасувати</button>
          <button type="submit" class="btn blue">Зберегти</button>
        </div>
      </form>
    </div>
  </div>


  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Вхід адміністратора</h3>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="adminEmail" required></div>
        <div class="form-group"><label>Пароль</label><input type="password" id="adminPassword" required></div>
        <div id="loginError" style="color:#ff6374;font-size:13px"></div>
        <div class="modal-actions"><button type="button" class="btn outline" onclick="closeLoginModal()">Скасувати</button><button type="submit" class="btn blue">Увійти</button></div>
      </form>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set, remove, update } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkB1BamCMrPshtejkl23pkRvCa_thJns8",
      authDomain: "yevheniipel.firebaseapp.com",
      databaseURL: "https://yevheniipel-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "yevheniipel",
      storageBucket: "yevheniipel.firebasestorage.app",
      messagingSenderId: "1062789800045",
      appId: "1:1062789800045:web:e72c6a2826b699fd579f64"
    };
    const ADMIN_UID = "DKOWrhsxWLUGiJyy6kyYjLVsZB22";
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const moviesRef = ref(db, 'movies');
    let currentDate = new Date();
    let movies = [];
    let isAdmin = false;
    const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

    onValue(moviesRef, snap => {
      const data = snap.val() || {};
      movies = Object.entries(data).map(([id, m]) => ({id, ...m}));
      renderCalendar();
    });

    onAuthStateChanged(auth, user => {
      isAdmin = !!user && user.uid === ADMIN_UID;
      document.body.classList.toggle('is-admin', isAdmin);
      document.getElementById('loginBtn').style.display = isAdmin ? 'none' : 'inline-block';
      document.getElementById('authStatus').textContent = isAdmin ? 'Адмін увійшов' : '';
      renderCalendar();
    });

    function renderCalendar() {
      const year=currentDate.getFullYear(), month=currentDate.getMonth();
      document.getElementById('monthYearLabel').innerText=`${monthNames[month]} ${year}`;
      const grid=document.getElementById('calendarGrid');
      while(grid.children.length>7) grid.removeChild(grid.lastChild);
      const firstDayIndex=(new Date(year,month,1).getDay()+6)%7;
      const totalDays=new Date(year,month+1,0).getDate();
      const today=new Date();
      for(let i=0;i<firstDayIndex;i++){const e=document.createElement('div');e.className='day-cell empty';grid.appendChild(e);}
      for(let day=1;day<=totalDays;day++){
        const cell=document.createElement('div'); cell.className='day-cell';
        const formattedDate=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===day) cell.classList.add('today');
        const num=document.createElement('span');num.className='day-num';num.innerText=day;cell.appendChild(num);
        movies.filter(m=>m.date===formattedDate).forEach(movie=>{
          const el=document.createElement('div');el.className=`movie-item ${movie.status}`;
          const title=document.createElement('span');title.textContent=`${movie.status==='watched'?'✓':'•'} ${movie.title}`;el.appendChild(title);
          if(isAdmin){const b=document.createElement('button');b.className='del-btn';b.textContent='✕';b.onclick=e=>deleteMovie(movie.id,e);el.appendChild(b);el.onclick=e=>{if(e.target.tagName!=='BUTTON') toggleStatus(movie.id,movie.status)}}
          cell.appendChild(el);
        });
        grid.appendChild(cell);
      }
    }
    window.changeMonth=d=>{currentDate.setMonth(currentDate.getMonth()+d);renderCalendar()};
    window.openModal=()=>{if(!isAdmin)return;document.getElementById('movieModal').classList.add('active');document.getElementById('movieDate').valueAsDate=new Date()};
    window.closeModal=()=>{document.getElementById('movieModal').classList.remove('active');document.getElementById('movieForm').reset()};
    window.deleteMovie=async(id,e)=>{e.stopPropagation();if(isAdmin&&confirm('Видалити цей запис?')) await remove(ref(db,`movies/${id}`))};
    window.toggleStatus=async(id,status)=>{if(isAdmin) await update(ref(db,`movies/${id}`),{status:status==='planned'?'watched':'planned'})};
    window.openLoginModal=()=>document.getElementById('loginModal').classList.add('active');
    window.closeLoginModal=()=>{document.getElementById('loginModal').classList.remove('active');document.getElementById('loginError').textContent=''};
    window.logoutAdmin=()=>signOut(auth);
    document.getElementById('movieForm').addEventListener('submit',async e=>{
      e.preventDefault();if(!isAdmin)return;
      const newRef=push(moviesRef);
      await set(newRef,{title:document.getElementById('movieTitle').value.trim(),date:document.getElementById('movieDate').value,status:document.getElementById('movieStatus').value,createdAt:Date.now()});
      window.closeModal();
    });
    document.getElementById('loginForm').addEventListener('submit',async e=>{
      e.preventDefault();document.getElementById('loginError').textContent='';
      try { const c=await signInWithEmailAndPassword(auth,document.getElementById('adminEmail').value,document.getElementById('adminPassword').value); if(c.user.uid!==ADMIN_UID){await signOut(auth);throw new Error('not-admin')} window.closeLoginModal(); }
      catch(err){document.getElementById('loginError').textContent='Не вдалося увійти. Перевір email і пароль.'}
    });
  </script>
</body>
</html>
