<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Черга фільмів — YevheniiPel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f4f7fb;font-family:Arial,sans-serif}.nav{position:sticky;top:0;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;background:#07090dee;border-bottom:1px solid #222936;z-index:10}.logo{font-size:25px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:#58a8ff}nav{display:flex;gap:25px}nav a{color:#a8b1bf;text-decoration:none;font-size:14px}nav a:hover,nav a.active{color:#58a8ff}.nav-right{display:flex;align-items:center;gap:12px}.btn{display:inline-block;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px;cursor:pointer;border:none}.blue{background:#58a8ff;color:#06101a}.blue:hover{background:#7ab8ff}.outline{border:1px solid #354050;color:#fff;background:transparent}.accent{background:linear-gradient(135deg,#ff9f43,#ff6b35);color:#111;box-shadow:0 0 24px rgba(255,132,56,.22)}.container{padding:42px 7%;max-width:1200px;margin:0 auto}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}.title{font-size:clamp(32px,4vw,50px);margin:0;letter-spacing:-1.5px}.title span{color:#58a8ff}.sub{color:#8b96a7;margin:8px 0 0}.panel{background:#0d121a;border:1px solid #242c38;border-radius:18px;padding:20px}.queue-list{display:flex;flex-direction:column;gap:12px}.queue-item{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:#0a0f16;border:1px solid #1e2733;border-radius:14px;padding:14px}.pos{width:42px;height:42px;border-radius:12px;background:#111a26;border:1px solid #2b3a4b;display:flex;align-items:center;justify-content:center;font-weight:900;color:#58a8ff}.movie-title{font-weight:800;font-size:17px}.meta{font-size:12px;color:#7f8b9d;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.mini{padding:8px 10px;border-radius:8px;border:1px solid #2a3544;background:#151d29;color:#fff;cursor:pointer}.mini:hover{border-color:#58a8ff}.danger:hover{border-color:#ff6374;color:#ff7b89}.empty{text-align:center;color:#788495;padding:36px 10px}.admin-only{display:none}.status{font-size:13px;color:#8b96a7}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);z-index:50;align-items:center;justify-content:center;padding:20px}.modal.active{display:flex}.modal-card{width:100%;max-width:440px;background:#0d121a;border:1px solid #293341;border-radius:18px;padding:26px}.form-group{margin-bottom:16px}.form-group label{display:block;color:#8d99a9;font-size:12px;font-weight:700;margin-bottom:6px;text-transform:uppercase}.form-group input{width:100%;background:#07090d;border:1px solid #293341;padding:12px;border-radius:8px;color:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.move-buttons{display:flex;gap:6px}@media(max-width:800px){nav{display:none}.queue-item{grid-template-columns:44px 1fr}.actions{grid-column:1/-1;justify-content:flex-start}.header{align-items:flex-start}.nav{padding:16px 5%}.container{padding:30px 5%}}
</style>
</head>
<body>
<header class="nav">
<a class="logo" href="index.html">Yevhenii<span>Pel</span></a>
<nav>
<a href="index.html#about">Про мене</a><a href="index.html#content">Контент</a><a href="index.html#schedule">Розклад</a><a href="calendar.html">Календар</a><a href="index.html#socials">Соцмережі</a>
</nav>
<div class="nav-right"><button id="authBtn" class="btn outline">Увійти</button><span id="authStatus" class="status"></span></div>
</header>
<main class="container">
<div class="header"><div><h1 class="title">Черга <span>фільмів</span></h1><p class="sub">Послідовність замовлених фільмів для майбутніх кіновечорів.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn accent" href="calendar.html">📅 До календаря</a><button id="addBtn" class="btn blue admin-only">+ Додати в чергу</button></div></div>
<section class="panel"><div id="queueList" class="queue-list"><div class="empty">Завантаження черги…</div></div></section>
</main>

<div id="addModal" class="modal"><div class="modal-card"><h3>Додати фільм у чергу</h3><div class="form-group"><label>Назва фільму</label><input id="titleInput" placeholder="Напр., Інтерстеллар"></div><div class="form-group"><label>Хто замовив</label><input id="requesterInput" placeholder="Напр., @viewer"></div><div class="modal-actions"><button id="cancelAdd" class="btn outline">Скасувати</button><button id="saveAdd" class="btn blue">Додати</button></div></div></div>
<div id="dateModal" class="modal"><div class="modal-card"><h3>Призначити дату</h3><div class="form-group"><label>Дата перегляду</label><input id="dateInput" type="date"></div><div class="modal-actions"><button id="cancelDate" class="btn outline">Скасувати</button><button id="saveDate" class="btn blue">Перенести в календар</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyBkB1BamCMrPshtejkl23pkRvCa_thJns8",authDomain:"yevheniipel.firebaseapp.com",databaseURL:"https://yevheniipel-default-rtdb.europe-west1.firebasedatabase.app/",projectId:"yevheniipel",storageBucket:"yevheniipel.firebasestorage.app",messagingSenderId:"1062789800045",appId:"1:1062789800045:web:e72c6a2826b699fd579f64"};
const ADMIN_UID="DKOWrhsxWLUGiJyy6kyYjLVsZB22";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
let queue=[];let isAdmin=false;let selectedId=null;
const queueRef=ref(db,'queue');
const list=document.getElementById('queueList');
const addBtn=document.getElementById('addBtn');
const authBtn=document.getElementById('authBtn');
const authStatus=document.getElementById('authStatus');
const addModal=document.getElementById('addModal');
const dateModal=document.getElementById('dateModal');

onAuthStateChanged(auth,user=>{isAdmin=!!user&&user.uid===ADMIN_UID;addBtn.style.display=isAdmin?'inline-block':'none';authBtn.textContent=user?'Вийти':'Увійти';authStatus.textContent=isAdmin?'Адмін увійшов':'';render();});
authBtn.onclick=async()=>{if(auth.currentUser){await signOut(auth);return;}const email=prompt('Email адміністратора:');if(!email)return;const password=prompt('Пароль:');if(!password)return;try{await signInWithEmailAndPassword(auth,email,password);}catch(e){alert('Не вдалося увійти. Перевір email і пароль.');}};

onValue(queueRef,snap=>{const data=snap.val()||{};queue=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order??999999)-(b.order??999999));render();});
function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(){if(!queue.length){list.innerHTML='<div class="empty">Черга поки порожня.</div>';return;}list.innerHTML=queue.map((m,i)=>`<div class="queue-item"><div class="pos">${i+1}</div><div><div class="movie-title">${esc(m.title||'Без назви')}</div><div class="meta">${m.requester?`Замовив: ${esc(m.requester)}`:'Без автора замовлення'}</div></div>${isAdmin?`<div class="actions"><div class="move-buttons"><button class="mini" onclick="moveItem('${m.id}',-1)">↑</button><button class="mini" onclick="moveItem('${m.id}',1)">↓</button></div><button class="mini" onclick="assignDate('${m.id}')">📅 Дата</button><button class="mini danger" onclick="deleteItem('${m.id}')">✕</button></div>`:''}</div>`).join('');}

window.moveItem=async(id,dir)=>{if(!isAdmin)return;const idx=queue.findIndex(x=>x.id===id),ni=idx+dir;if(idx<0||ni<0||ni>=queue.length)return;const a=queue[idx],b=queue[ni];await update(ref(db),{[`queue/${a.id}/order`]:b.order??ni,[`queue/${b.id}/order`]:a.order??idx});};
window.deleteItem=async id=>{if(!isAdmin)return;if(confirm('Видалити фільм із черги?'))await remove(ref(db,'queue/'+id));};
window.assignDate=id=>{if(!isAdmin)return;selectedId=id;document.getElementById('dateInput').value='';dateModal.classList.add('active');};

addBtn.onclick=()=>addModal.classList.add('active');
document.getElementById('cancelAdd').onclick=()=>addModal.classList.remove('active');
document.getElementById('saveAdd').onclick=async()=>{const title=document.getElementById('titleInput').value.trim(),requester=document.getElementById('requesterInput').value.trim();if(!title)return alert('Введи назву фільму.');const nref=push(queueRef);await set(nref,{title,requester,order:queue.length,createdAt:Date.now()});document.getElementById('titleInput').value='';document.getElementById('requesterInput').value='';addModal.classList.remove('active');};
document.getElementById('cancelDate').onclick=()=>dateModal.classList.remove('active');
document.getElementById('saveDate').onclick=async()=>{const date=document.getElementById('dateInput').value;if(!date)return alert('Оберіть дату.');const movie=queue.find(x=>x.id===selectedId);if(!movie)return;const movieRef=push(ref(db,'movies'));await set(movieRef,{title:movie.title,date,status:'planned',requester:movie.requester||'',fromQueue:true,createdAt:Date.now()});await remove(ref(db,'queue/'+selectedId));dateModal.classList.remove('active');};
</script>
</body>
</html>
