<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Черга фільмів — YevheniiPel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07090d;color:#f4f7fb;font-family:Arial,sans-serif}
.nav{position:sticky;top:0;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;background:#07090dee;border-bottom:1px solid #222936;z-index:10}
.logo{font-size:25px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:#58a8ff}
nav{display:flex;gap:25px}nav a{color:#a8b1bf;text-decoration:none;font-size:14px}nav a:hover{color:#58a8ff}
.nav-right{display:flex;align-items:center;gap:12px}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:bold;font-size:14px;cursor:pointer;border:none}
.blue{background:#58a8ff;color:#06101a}.blue:hover{background:#7ab8ff}
.outline{border:1px solid #354050;color:#fff;background:transparent}
.accent{background:linear-gradient(135deg,#ff9f43,#ff6b35);color:#111;box-shadow:0 0 24px rgba(255,132,56,.22)}
.container{padding:42px 7%;max-width:1250px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.title{font-size:clamp(32px,4vw,50px);margin:0;letter-spacing:-1.5px}.title span{color:#58a8ff}
.sub{color:#8b96a7;margin:8px 0 0}
.panel{background:#0d121a;border:1px solid #242c38;border-radius:18px;padding:20px}
.queue-list{display:flex;flex-direction:column;gap:14px}
.queue-item{display:grid;grid-template-columns:54px 96px minmax(0,1fr) auto;gap:16px;align-items:center;background:#0a0f16;border:1px solid #1e2733;border-radius:16px;padding:14px;transition:.2s}
.queue-item:hover{border-color:#33465d;background:#0c121b}
.pos{width:42px;height:42px;border-radius:12px;background:#111a26;border:1px solid #2b3a4b;display:flex;align-items:center;justify-content:center;font-weight:900;color:#58a8ff}
.poster{width:88px;height:132px;border-radius:10px;object-fit:cover;background:#111722;border:1px solid #263141;display:block}
.poster-placeholder{width:88px;height:132px;border-radius:10px;background:#111722;border:1px solid #263141;display:flex;align-items:center;justify-content:center;text-align:center;color:#6f7b8d;font-size:11px;padding:8px}
.movie-main{min-width:0}
.movie-title{font-weight:900;font-size:20px;line-height:1.2}
.movie-subtitle{font-size:13px;color:#9aa6b6;margin-top:5px}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:8px;background:#111a26;border:1px solid #273444;color:#b7c1cf;font-size:12px}
.overview{font-size:13px;line-height:1.45;color:#8d98a8;margin-top:10px;max-width:720px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.move-buttons{display:flex;gap:6px}
.mini{padding:9px 11px;border-radius:8px;border:1px solid #2a3544;background:#151d29;color:#fff;cursor:pointer}
.mini:hover{border-color:#58a8ff}
.danger:hover{border-color:#ff6374;color:#ff7b89}
.empty{text-align:center;color:#788495;padding:36px 10px}
.admin-only{display:none}.status{font-size:13px;color:#8b96a7}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);z-index:50;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}.modal-card{width:100%;max-width:440px;background:#0d121a;border:1px solid #293341;border-radius:18px;padding:26px}
.form-group{margin-bottom:16px}.form-group label{display:block;color:#8d99a9;font-size:12px;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.form-group input{width:100%;background:#07090d;border:1px solid #293341;padding:12px;border-radius:8px;color:#fff}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
@media(max-width:850px){
  nav{display:none}.nav{padding:16px 5%}.container{padding:30px 5%}
  .queue-item{grid-template-columns:44px 74px 1fr}.poster,.poster-placeholder{width:68px;height:102px}
  .actions{grid-column:1/-1;justify-content:flex-start}
}
@media(max-width:560px){
  .queue-item{grid-template-columns:38px 62px 1fr;gap:10px;padding:10px}
  .poster,.poster-placeholder{width:58px;height:87px}
  .movie-title{font-size:16px}.overview{display:none}.badge{font-size:11px}
}
</style>
</head>
<body>
<header class="nav">
<a class="logo" href="index.html">Yevhenii<span>Pel</span></a>
<nav>
<a href="index.html#about">Про мене</a>
<a href="index.html#content">Контент</a>
<a href="index.html#schedule">Розклад</a>
<a href="calendar.html">Календар</a>
<a href="index.html#socials">Соцмережі</a>
</nav>
<div class="nav-right">
<button id="authBtn" class="btn outline">Увійти</button>
<span id="authStatus" class="status"></span>
</div>
</header>

<main class="container">
<div class="header">
  <div>
    <h1 class="title">Черга <span>фільмів</span></h1>
    <p class="sub">Замовлення з Twitch автоматично отримують дані та постер із TMDb.</p>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <a class="btn accent" href="calendar.html">📅 До календаря</a>
    <button id="addBtn" class="btn blue admin-only">+ Додати в чергу</button>
  </div>
</div>
<section class="panel">
  <div id="queueList" class="queue-list"><div class="empty">Завантаження черги…</div></div>
</section>
</main>

<div id="addModal" class="modal">
  <div class="modal-card">
    <h3>Додати фільм у чергу</h3>
    <div class="form-group"><label>Назва фільму</label><input id="titleInput" placeholder="Напр., Інтерстеллар"></div>
    <div class="form-group"><label>Хто замовив</label><input id="requesterInput" placeholder="Напр., @viewer"></div>
    <div class="modal-actions">
      <button id="cancelAdd" class="btn outline">Скасувати</button>
      <button id="saveAdd" class="btn blue">Додати</button>
    </div>
  </div>
</div>

<div id="dateModal" class="modal">
  <div class="modal-card">
    <h3>Призначити дату</h3>
    <div class="form-group"><label>Дата перегляду</label><input id="dateInput" type="date"></div>
    <div class="modal-actions">
      <button id="cancelDate" class="btn outline">Скасувати</button>
      <button id="saveDate" class="btn blue">Перенести в календар</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyBkB1BamCMrPshtejkl23pkRvCa_thJns8",
  authDomain:"yevheniipel.firebaseapp.com",
  databaseURL:"https://yevheniipel-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"yevheniipel",
  storageBucket:"yevheniipel.firebasestorage.app",
  messagingSenderId:"1062789800045",
  appId:"1:1062789800045:web:e72c6a2826b699fd579f64"
};

const ADMIN_UID="DKOWrhsxWLUGiJyy6kyYjLVsZB22";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let queue=[];
let isAdmin=false;
let selectedId=null;

const queueRef=ref(db,'queue');
const list=document.getElementById('queueList');
const addBtn=document.getElementById('addBtn');
const authBtn=document.getElementById('authBtn');
const authStatus=document.getElementById('authStatus');
const addModal=document.getElementById('addModal');
const dateModal=document.getElementById('dateModal');

onAuthStateChanged(auth,user=>{
  isAdmin=!!user&&user.uid===ADMIN_UID;
  addBtn.style.display=isAdmin?'inline-block':'none';
  authBtn.textContent=user?'Вийти':'Увійти';
  authStatus.textContent=isAdmin?'Адмін увійшов':'';
  render();
});

authBtn.onclick=async()=>{
  if(auth.currentUser){
    await signOut(auth);
    return;
  }
  const email=prompt('Email адміністратора:');
  if(!email)return;
  const password=prompt('Пароль:');
  if(!password)return;
  try{
    await signInWithEmailAndPassword(auth,email,password);
  }catch(e){
    alert('Не вдалося увійти. Перевір email і пароль.');
  }
};

onValue(queueRef,snap=>{
  const data=snap.val()||{};
  queue=Object.entries(data)
    .map(([id,v])=>({id,...v}))
    .sort((a,b)=>{
      const ao=a.order;
      const bo=b.order;
      if(Number.isFinite(ao)&&Number.isFinite(bo))return ao-bo;
      if(Number.isFinite(ao))return -1;
      if(Number.isFinite(bo))return 1;
      const at=new Date(a.createdAt||0).getTime()||0;
      const bt=new Date(b.createdAt||0).getTime()||0;
      return at-bt;
    });
  render();
});

function esc(s=''){
  return String(s).replace(/[&<>'"]/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
  }[c]));
}

function render(){
  if(!queue.length){
    list.innerHTML='<div class="empty">Черга поки порожня.</div>';
    return;
  }

  list.innerHTML=queue.map((m,i)=>{
    const displayTitle=m.tmdbTitle||m.title||'Без назви';
    const requestedTitle=m.title&&m.tmdbTitle&&m.title!==m.tmdbTitle ? m.title : '';
    const year=m.year||'';
    const requester=m.requester||'Невідомо';
    const overview=m.overview||'';
    const cost=m.rewardCost||'';
    const original=m.originalTitle&&m.originalTitle!==displayTitle ? m.originalTitle : '';
    const poster=m.posterUrl
      ? `<img class="poster" src="${esc(m.posterUrl)}" alt="Постер ${esc(displayTitle)}" loading="lazy">`
      : `<div class="poster-placeholder">Постер не знайдено</div>`;

    return `
      <article class="queue-item">
        <div class="pos">${i+1}</div>
        ${poster}
        <div class="movie-main">
          <div class="movie-title">${esc(displayTitle)}${year?` <span style="color:#7f8b9d;font-weight:700">(${esc(year)})</span>`:''}</div>
          ${requestedTitle?`<div class="movie-subtitle">Замовлена назва: ${esc(requestedTitle)}</div>`:''}
          ${original?`<div class="movie-subtitle">Оригінальна назва: ${esc(original)}</div>`:''}
          <div class="meta-row">
            <span class="badge">👤 Замовив: ${esc(requester)}</span>
            ${cost?`<span class="badge">💎 ${esc(cost)} балів</span>`:''}
            ${m.rewardTitle?`<span class="badge">🎁 ${esc(m.rewardTitle)}</span>`:''}
          </div>
          ${overview?`<div class="overview">${esc(overview)}</div>`:''}
        </div>
        ${isAdmin?`
          <div class="actions">
            <div class="move-buttons">
              <button class="mini" onclick="moveItem('${m.id}',-1)" title="Підняти вище">↑</button>
              <button class="mini" onclick="moveItem('${m.id}',1)" title="Опустити нижче">↓</button>
            </div>
            <button class="mini" onclick="assignDate('${m.id}')">📅 Дата</button>
            <button class="mini danger" onclick="deleteItem('${m.id}')">✕</button>
          </div>`:''}
      </article>`;
  }).join('');
}

window.moveItem=async(id,dir)=>{
  if(!isAdmin)return;
  const idx=queue.findIndex(x=>x.id===id);
  const ni=idx+dir;
  if(idx<0||ni<0||ni>=queue.length)return;

  const a=queue[idx];
  const b=queue[ni];
  const aOrder=Number.isFinite(a.order)?a.order:idx;
  const bOrder=Number.isFinite(b.order)?b.order:ni;

  await update(ref(db),{
    [`queue/${a.id}/order`]:bOrder,
    [`queue/${b.id}/order`]:aOrder
  });
};

window.deleteItem=async id=>{
  if(!isAdmin)return;
  if(confirm('Видалити фільм із черги?')){
    await remove(ref(db,'queue/'+id));
  }
};

window.assignDate=id=>{
  if(!isAdmin)return;
  selectedId=id;
  document.getElementById('dateInput').value='';
  dateModal.classList.add('active');
};

addBtn.onclick=()=>addModal.classList.add('active');
document.getElementById('cancelAdd').onclick=()=>addModal.classList.remove('active');

document.getElementById('saveAdd').onclick=async()=>{
  const title=document.getElementById('titleInput').value.trim();
  const requester=document.getElementById('requesterInput').value.trim();
  if(!title)return alert('Введи назву фільму.');

  const nref=push(queueRef);
  await set(nref,{
    title,
    requester,
    order:queue.length,
    createdAt:new Date().toISOString()
  });

  document.getElementById('titleInput').value='';
  document.getElementById('requesterInput').value='';
  addModal.classList.remove('active');
};

document.getElementById('cancelDate').onclick=()=>dateModal.classList.remove('active');

document.getElementById('saveDate').onclick=async()=>{
  const date=document.getElementById('dateInput').value;
  if(!date)return alert('Оберіть дату.');

  const movie=queue.find(x=>x.id===selectedId);
  if(!movie)return;

  const movieRef=push(ref(db,'movies'));

  // Передаємо в календар ВСЮ отриману інформацію з Twitch/TMDb.
  await set(movieRef,{
    title:movie.title||movie.tmdbTitle||'Без назви',
    date,
    status:'planned',
    requester:movie.requester||'',
    fromQueue:true,
    createdAt:Date.now(),

    twitchUserId:movie.twitchUserId||'',
    redemptionId:movie.redemptionId||'',
    rewardId:movie.rewardId||'',
    rewardTitle:movie.rewardTitle||'',
    rewardCost:movie.rewardCost||0,

    tmdbId:movie.tmdbId||null,
    tmdbTitle:movie.tmdbTitle||'',
    originalTitle:movie.originalTitle||'',
    year:movie.year||'',
    releaseDate:movie.releaseDate||'',
    overview:movie.overview||'',
    posterUrl:movie.posterUrl||''
  });

  await remove(ref(db,'queue/'+selectedId));
  selectedId=null;
  dateModal.classList.remove('active');
};
</script>
</body>
</html>
